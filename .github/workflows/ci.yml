name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      # This repository is held to the guide it enforces: the linter checks its
      # own shell scripts. ShellCheck is already on the runner; shfmt is not.
      - name: install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - name: lint shell scripts
        run: bash ./scripts/lint.sh
